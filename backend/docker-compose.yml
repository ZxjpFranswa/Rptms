services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rptms
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - rptms_mysql:/var/lib/mysql

  api:
    image: serversideup/php:8.3-fpm-nginx
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8080"
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: rptms
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      - mysql

volumes:
  rptms_mysql:
